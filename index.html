<!DOCTYPE html>
<html lang="en">
<head>
<script data-ika-hide-broken-images>window.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"){t.style.display="none";}},true);</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Daily Writing Prompt Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            lora: ['Lora', 'Georgia', 'serif'],
            roboto: ['Roboto', 'sans-serif'],
            times: ['"Times New Roman"', 'Times', 'serif'],
            arial: ['Arial', 'Helvetica', 'sans-serif'],
            tahoma: ['Tahoma', 'sans-serif'],
            verdana: ['Verdana', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    /* TEMPORARY TEST: check whether Notion displays the webpage background.
       The widget card keeps its own customizable background color. */
    html, body {
      background: #ff00ff !important;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(155,155,155,0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(155,155,155,0.7); }
    .prompt-fade { transition: opacity .25s ease, transform .25s ease; }
    .prompt-hidden { opacity: 0; transform: translateY(4px); }
    .custom-btn { transition: all .2s; background-color: var(--button-bg); color: var(--button-text); }
    .custom-btn:hover { opacity: .9; }
    .custom-btn:active { transform: scale(.98); }
    #widget-card {
      --bg-color: #ffffff;
      --text-color: #000000;
      --title-color: #b45309;
      --border-color: #e5e7eb;
      --button-bg: #1f2937;
      --button-text: #ffffff;
      --add-own-bg: #1f2937;
      --add-own-text: #ffffff;
      --text-size: 1rem;
      --prompt-font-size: 1.25rem;
    }
    #widget-card {
      background-color: var(--bg-color);
      color: var(--text-color);
      border-color: var(--border-color);
      font-size: var(--text-size);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 500px;
    }
    #widget-card > div { flex-shrink: 0; }
    #prompt-display {
      font-size: calc(var(--text-size) * 1.25);
      line-height: 1.45;
      margin: 0;
    }
    #view-prompt {
      flex: 1 1 auto;
      min-height: 140px;
      overflow-y: auto;
    }
    #view-manage, #view-settings, #view-history {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-200 p-2 sm:p-4 flex items-center justify-center min-h-screen">

  <div id="widget-card" class="w-full max-w-xl border rounded-none shadow-sm overflow-hidden relative">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b" style="border-color: var(--border-color);">
      <div class="flex items-center space-x-2">
        <span id="header-title" class="text-2xl font-bold tracking-wider" style="color: var(--title-color);">Daily Prompt</span>
        <span id="date-badge" class="text-xs px-2 py-0.5 rounded-none bg-black/5 text-gray-500 font-medium"></span>
      </div>
      <button id="btn-settings" class="custom-btn p-2 rounded-none flex items-center justify-center" title="Settings">
        &#x2699;
      </button>
    </div>

    <!-- Prompt View -->
      <div id="view-prompt" class="py-2 px-4 flex flex-col gap-2">
        <div class="flex-1 flex items-center py-1">
          <blockquote id="prompt-display" class="font-serif select-all prompt-fade">Loading your writing prompt...</blockquote>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t" style="border-color: var(--border-color);">
        <div class="flex items-center space-x-2">
          <button id="btn-shuffle" class="custom-btn flex items-center space-x-1.5 px-2.5 py-1.5 rounded-none text-xs font-medium" title="Show another prompt">
            <span aria-hidden="true">⤨</span><span>Shuffle</span>
          </button>
          <button id="btn-copy" class="custom-btn flex items-center space-x-1.5 px-2.5 py-1.5 rounded-none text-xs font-medium">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span id="copy-text">Copy</span>
          </button>
          <button id="btn-history" class="custom-btn flex items-center space-x-1.5 px-2.5 py-1.5 rounded-none text-xs font-medium" title="Prompt history">
            <span aria-hidden="true">↺</span><span>History</span>
          </button>
        </div>

        <div class="flex items-center space-x-2">
          <button id="btn-quick-add" class="custom-btn flex items-center space-x-1 py-1 px-2 rounded-none text-xs">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span>Add My Own</span>
          </button>

          <button id="btn-manage" class="custom-btn flex items-center space-x-1 py-1 px-2 rounded-none text-xs">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
            <span>My Prompts (<span id="prompt-count">0</span>)</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Manage Prompts -->
      <div id="view-manage" class="hidden p-2">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-sm font-semibold">Your Writing Prompts</h3>
          <p class="text-xs text-gray-500">Saved automatically in your browser for this Notion widget.</p>
        </div>
        <button id="btn-close-manage" class="p-1.5 rounded-none text-gray-500 hover:bg-gray-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="form-add-prompt" class="flex gap-2 mb-3">
        <input id="input-new-prompt" type="text" placeholder="Type a new writing prompt..." required
          class="flex-1 text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800">
        <button type="submit" class="px-3 py-2 rounded-none text-xs font-medium custom-btn">Add</button>
      </form>

      <div class="mb-3">
        <button id="btn-toggle-bulk" type="button" class="text-[11px] font-medium text-gray-500 hover:underline flex items-center space-x-1">
          <span>+ Bulk paste multiple prompts (one per line)</span>
        </button>
        <div id="bulk-container" class="hidden mt-2 p-3 rounded-none bg-gray-50 border border-gray-200">
          <textarea id="input-bulk-prompts" rows="3" placeholder="Paste multiple prompts here, one per line..."
            class="w-full text-xs p-2 rounded-none border bg-white focus:outline-none mb-2"></textarea>
          <div class="flex justify-end space-x-2">
            <button id="btn-cancel-bulk" type="button" class="px-2.5 py-1 text-xs rounded-none text-gray-500 hover:bg-gray-200">Cancel</button>
            <button id="btn-save-bulk" type="button" class="px-2.5 py-1 text-xs rounded-none font-medium custom-btn">Import Lines</button>
          </div>
        </div>
      </div>

      <div id="prompt-list" class="max-h-48 overflow-y-auto divide-y divide-gray-200 border rounded-none bg-gray-50">
        <!-- Prompt items populated by JS -->
      </div>

      <div class="flex items-center justify-between mt-4 pt-3 border-t text-[11px] text-gray-500">
        <div class="space-x-3">
          <button id="btn-restore-defaults" class="hover:underline">Restore Defaults</button>
          <span>•</span>
          <button id="btn-clear-all" class="hover:underline text-red-600">Clear All</button>
        </div>
        <button id="btn-done" class="px-3 py-1 rounded-none bg-gray-100 text-gray-800 font-medium hover:opacity-80">Done</button>
      </div>
    </div>

    <!-- Settings -->
      <div id="view-settings" class="hidden p-1 overflow-y-auto flex-1" style="max-height: 300px;">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold">Widget Settings</h3>
        <button id="btn-close-settings" class="p-1.5 rounded-none text-gray-500 hover:bg-gray-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="space-y-4">
        <div><label class="block text-xs font-medium mb-1">Header Title Text</label><input id="input-header-title" type="text" placeholder="e.g., Daily Prompt" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800"></div>

        <div><label class="block text-xs font-medium mb-1">Background Color (hex or rgb)</label><input id="input-bg-color" type="text" placeholder="#ffffff or rgb(255,255,255)" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800"></div>
        <div><label class="block text-xs font-medium mb-1">Text Color (hex or rgb)</label><input id="input-text-color" type="text" placeholder="#000000 or rgb(0,0,0)" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800"></div>
        <div><label class="block text-xs font-medium mb-1">Title (Header) Color</label><input id="input-title-color" type="text" placeholder="#b45309" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800"></div>
        <div><label class="block text-xs font-medium mb-1">Border Color</label><input id="input-border-color" type="text" placeholder="#e5e7eb" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800"></div>
        <div><label class="block text-xs font-medium mb-1">Button Background Color</label><input id="input-button-bg" type="text" placeholder="#1f2937" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800"></div>
        <div><label class="block text-xs font-medium mb-1">Button Text Color</label><input id="input-button-text" type="text" placeholder="#ffffff" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800"></div>

        <div class="flex items-center space-x-2">
          <label class="block text-xs font-medium mb-1">Text Size</label>
          <input id="input-text-size" type="range" min="0.75" max="2.0" step="0.05" value="1" class="flex-1">
          <span id="size-display" class="text-xs w-12 text-center">1rem</span>
        </div>

        <div><label class="block text-xs font-medium mb-1">Font Family</label>
          <select id="select-font" class="w-full text-xs px-3 py-2 rounded-none border bg-white focus:outline-none focus:ring-1 focus:ring-gray-800">
            <option value="inter">Inter (default)</option>
            <option value="lora">Lora (serif)</option>
            <option value="roboto">Roboto</option>
            <option value="times">Times New Roman</option>
            <option value="arial">Arial</option>
            <option value="tahoma">Tahoma</option>
            <option value="verdana">Verdana</option>
          </select>
        </div>

        <div class="flex justify-end"><button id="btn-save-settings" class="px-3 py-1 rounded-none bg-gray-800 text-white hover:opacity-90">Save Settings</button></div>
      </div>
    </div>

    <!-- History -->
      <div id="view-history" class="hidden p-2">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold">Prompt History</h3>
        <button id="btn-close-history" class="p-1.5 rounded-none text-gray-500 hover:bg-gray-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="history-list" class="max-h-64 overflow-y-auto divide-y divide-gray-200 border rounded-none bg-gray-50">
        <!-- History items populated by JS -->
      </div>
      <div class="flex justify-end mt-3"><button id="btn-clear-history" class="px-2.5 py-1 text-xs rounded-none text-red-600 hover:bg-red-100">Clear History</button></div>
    </div>

  </div>

  <script>
    $(function () {
      const STORAGE_PROMPTS = 'notion_widget_custom_prompts_v1';
      const STORAGE_DAILY = 'notion_widget_daily_state_v1';
      const STORAGE_SETTINGS = 'notion_widget_custom_settings_v1';
      const STORAGE_HISTORY = 'notion_widget_prompt_history_v1';

      const defaultPrompts = [
        `Write about a character who discovers an old voicemail from someone who never existed.`,
        `Describe a room in your childhood home from the perspective of a stranger seeing it today.`,
        `What is a belief you held strongly five years ago that you have completely let go of?`,
        `A train stops at a station that isn't on any map. Only one passenger gets off. Why?`,
        `Write a scene where two people are having a polite conversation while both hiding the same secret.`,
        `If your current mood were a weather forecast and a landscape, what would it look like?`,
        `You find a receipt in your coat pocket for an item you don't remember buying: "1x Second Chance".`,
        `Write a letter to your future self ten years from today, focusing only on small everyday details.`,
        `Invent a holiday celebrated by only two people in the world. How did it start?`,
        `Start a story with the sentence: "The lights went out right before the truth was spoken."`,
        `Write about an ordinary object on your desk as if it were a priceless historical artifact.`,
        `What is the most memorable meal you have ever eaten, and what was happening around the table?`,
        `A botanist discovers a plant that blooms only when someone tells a lie nearby.`,
        `Describe a moment in your life when a small decision changed everything that followed.`,
        `Write about a memory that feels like a different season than the one you are currently in.`
      ];

      let prompts = [];
      let currentPromptIndex = -1;
      let promptHistory = [];

      function setDateBadge() {
        const now = new Date();
        const opt = { weekday: 'short', month: 'short', day: 'numeric' };
        $('#date-badge').text(now.toLocaleDateString(undefined, opt));
      }

      function readStoredJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (error) {
          console.warn('Could not read saved widget data:', key, error);
          return fallback;
        }
      }

      function loadPrompts() {
        const stored = readStoredJSON(STORAGE_PROMPTS, null);
        prompts = Array.isArray(stored) ? stored.filter(p => typeof p === 'string' && p.trim()) : [...defaultPrompts];
        $('#prompt-count').text(prompts.length);
      }
      function savePrompts() {
        localStorage.setItem(STORAGE_PROMPTS, JSON.stringify(prompts));
        $('#prompt-count').text(prompts.length);
      }

      function getFontFamily(key) {
        const map = {
          inter: 'Inter, sans-serif',
          lora: 'Lora, serif',
          roboto: 'Roboto, sans-serif',
          times: '"Times New Roman", Times, serif',
          arial: 'Arial, Helvetica, sans-serif',
          tahoma: 'Tahoma, sans-serif',
          verdana: 'Verdana, sans-serif'
        };
        return map[key] || map.inter;
      }

      function loadSettings() {
        const s = readStoredJSON(STORAGE_SETTINGS, {});
        if (s.bg) $('#widget-card').css('--bg-color', s.bg);
        if (s.text) $('#widget-card').css('--text-color', s.text);
        if (s.title) $('#widget-card').css('--title-color', s.title);
        if (s.border) $('#widget-card').css('--border-color', s.border);
        if (s.btnBg) $('#widget-card').css('--button-bg', s.btnBg);
        if (s.btnText) $('#widget-card').css('--button-text', s.btnText);
        if (s.textSize) {
          $('#widget-card').css('--text-size', s.textSize);
          const num = parseFloat(s.textSize);
          $('#input-text-size').val(num);
          $('#size-display').text(s.textSize);
        }
        if (s.font) {
          $('#widget-card').css('font-family', getFontFamily(s.font));
          $('#select-font').val(s.font);
        }
        if (s.headerTitle) $('#header-title').text(s.headerTitle);
        // Populate inputs
        $('#input-header-title').val(s.headerTitle || '');
        $('#input-bg-color').val(s.bg || '');
        $('#input-text-color').val(s.text || '');
        $('#input-title-color').val(s.title || '');
        $('#input-border-color').val(s.border || '');
        $('#input-button-bg').val(s.btnBg || '');
        $('#input-button-text').val(s.btnText || '');
      }

      $('#btn-save-settings').on('click', function () {
        const sizeVal = $('#input-text-size').val();
        const sizeStr = sizeVal + 'rem';
        const s = {
          bg: $('#input-bg-color').val().trim() || null,
          text: $('#input-text-color').val().trim() || null,
          title: $('#input-title-color').val().trim() || null,
          border: $('#input-border-color').val().trim() || null,
          btnBg: $('#input-button-bg').val().trim() || null,
          btnText: $('#input-button-text').val().trim() || null,
          textSize: sizeStr,
          font: $('#select-font').val(),
          headerTitle: $('#input-header-title').val().trim() || 'Daily Prompt'
        };
        localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(s));
        loadSettings();
      });

      $('#input-text-size').on('input', function () {
        const val = $(this).val();
        const str = val + 'rem';
        $('#size-display').text(str);
        $('#widget-card').css('--text-size', str);
      });

      $('#btn-settings').on('click', function () {
        $('#view-settings').removeClass('hidden');
        $('#view-prompt, #view-manage, #view-history').addClass('hidden');
      });
      $('#btn-close-settings').on('click', function () {
        $('#view-settings').addClass('hidden');
        $('#view-prompt').removeClass('hidden');
      });

      function todayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      function initDailyPrompt() {
        if (!prompts.length) {
          displayPromptText('No prompts available. Add some first.');
          return;
        }
        const today = todayKey();
        const saved = readStoredJSON(STORAGE_DAILY, {});
        if (saved.date === today && saved.prompt && prompts.includes(saved.prompt)) {
          currentPromptIndex = prompts.indexOf(saved.prompt);
          displayPromptText(saved.prompt);
          return;
        }
        currentPromptIndex = Math.floor(Math.random() * prompts.length);
        const chosen = prompts[currentPromptIndex];
        saveDailyState(chosen);
        displayPromptText(chosen);
        addToHistory(chosen);
      }
      function saveDailyState(text) {
        const today = todayKey();
        localStorage.setItem(STORAGE_DAILY, JSON.stringify({ date: today, prompt: text }));
      }
      function displayPromptText(text) {
        const $el = $('#prompt-display');
        $el.addClass('prompt-hidden');
        setTimeout(() => { $el.text(text).removeClass('prompt-hidden'); }, 150);
      }

      $('#btn-shuffle').on('click', function () {
        if (!prompts.length) return;
        let next = currentPromptIndex;
        while (next === currentPromptIndex && prompts.length > 1) next = Math.floor(Math.random()*prompts.length);
        currentPromptIndex = next;
        const chosen = prompts[currentPromptIndex];
        saveDailyState(chosen);
        displayPromptText(chosen);
        addToHistory(chosen);
      });

      $('#btn-copy').on('click', function () {
        const txt = $('#prompt-display').text().trim();
        navigator.clipboard.writeText(txt).then(() => {
          $('#copy-text').text('Copied!');
          setTimeout(() => $('#copy-text').text('Copy'), 1500);
        });
      });

      function renderPromptList() {
        const $list = $('#prompt-list');
        $list.empty();
        if (!prompts.length) {
          $list.append(`<div class="p-6 text-center text-xs text-gray-500">No prompts yet. Add one above!</div>`);
          return;
        }
        prompts.forEach((p,i) => {
          const $row = $(`
            <div class="flex items-start justify-between gap-2 p-2.5 text-xs hover:bg-gray-200 rounded-none group">
              <span class="break-words flex-1 select-all"></span>
              <div class="flex items-center space-x-1">
                <button data-action="use" data-idx="${i}" class="custom-btn px-2 py-1 rounded-none text-[10px] font-medium" title="Use now">Use</button>
                <button data-action="delete" data-idx="${i}" class="custom-btn p-1 rounded-none" title="Delete">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>
          `);
          $row.find('span').text(p);
          $list.append($row);
        });
      }

      function openManage() {
        renderPromptList();
        $('#view-prompt').addClass('hidden');
        $('#view-manage').removeClass('hidden');
      }
      function closeManage() {
        $('#view-manage').addClass('hidden');
        $('#view-prompt').removeClass('hidden');
      }
      $('#btn-manage').on('click', openManage);
      $('#btn-quick-add').on('click', function () {
        openManage();
        setTimeout(() => $('#input-new-prompt').focus(), 100);
      });
      $('#btn-close-manage, #btn-done').on('click', closeManage);

      $('#form-add-prompt').on('submit', function(e){
        e.preventDefault();
        const val = $('#input-new-prompt').val().trim();
        if (!val) return;
        prompts.unshift(val);
        savePrompts();
        renderPromptList();
        $('#input-new-prompt').val('');
        currentPromptIndex = 0;
        saveDailyState(val);
        displayPromptText(val);
        addToHistory(val);
      });

      $('#btn-toggle-bulk').on('click', () => $('#bulk-container').toggleClass('hidden'));
      $('#btn-cancel-bulk').on('click', () => { $('#bulk-container').addClass('hidden'); $('#input-bulk-prompts').val(''); });
      $('#btn-save-bulk').on('click', () => {
        const lines = $('#input-bulk-prompts').val().split('\n').map(l=>l.trim()).filter(l=>l);
        if (lines.length) {
          prompts = [...lines, ...prompts];
          savePrompts();
          renderPromptList();
          currentPromptIndex = 0;
          saveDailyState(prompts[0]);
          displayPromptText(prompts[0]);
          addToHistory(prompts[0]);
        }
        $('#input-bulk-prompts').val('');
        $('#bulk-container').addClass('hidden');
      });

      $('#prompt-list').on('click', 'button[data-action]', function(){
        const idx = parseInt($(this).attr('data-idx'), 10);
        const action = $(this).attr('data-action');
        if (!Number.isInteger(idx) || !prompts[idx]) return;

        if (action === 'delete') {
          const deletedPrompt = prompts[idx];
          prompts.splice(idx, 1);
          savePrompts();

          const savedDaily = readStoredJSON(STORAGE_DAILY, {});
          if (savedDaily.prompt === deletedPrompt) {
            if (prompts.length) {
              currentPromptIndex = Math.floor(Math.random() * prompts.length);
              const replacement = prompts[currentPromptIndex];
              saveDailyState(replacement);
              displayPromptText(replacement);
              addToHistory(replacement);
            } else {
              currentPromptIndex = -1;
              localStorage.removeItem(STORAGE_DAILY);
              displayPromptText('No prompts available. Add some first.');
            }
          } else if (prompts.length) {
            currentPromptIndex = prompts.indexOf(savedDaily.prompt);
          } else {
            currentPromptIndex = -1;
            localStorage.removeItem(STORAGE_DAILY);
            displayPromptText('No prompts available. Add some first.');
          }
          renderPromptList();
          return;
        }

        if (action === 'use') {
          const chosen = prompts[idx];
          currentPromptIndex = idx;
          saveDailyState(chosen);
          displayPromptText(chosen);
          addToHistory(chosen);
          closeManage();
        }
      });

      $('#btn-restore-defaults').on('click', function(){
        prompts = [...defaultPrompts];
        savePrompts();
        renderPromptList();
        currentPromptIndex = prompts.length ? 0 : -1;
        if (prompts.length) {
          saveDailyState(prompts[0]);
          displayPromptText(prompts[0]);
          addToHistory(prompts[0]);
        } else {
          localStorage.removeItem(STORAGE_DAILY);
          displayPromptText('No prompts available. Add some first.');
        }
      });
      $('#btn-clear-all').on('click', function(){
        prompts = [];
        currentPromptIndex = -1;
        localStorage.removeItem(STORAGE_DAILY);
        savePrompts();
        renderPromptList();
        displayPromptText('No prompts available. Add some first.');
      });

      function loadHistory() {
        const stored = readStoredJSON(STORAGE_HISTORY, []);
        promptHistory = Array.isArray(stored) ? stored : [];
      }
      function addToHistory(text) {
        if (!text) return;
        promptHistory.unshift({ text, date: new Date().toLocaleString() });
        if (promptHistory.length > 100) promptHistory.pop();
        localStorage.setItem(STORAGE_HISTORY, JSON.stringify(promptHistory));
      }
      function renderHistory() {
        const $list = $('#history-list');
        $list.empty();
        if (!promptHistory.length) {
          $list.append('<div class="p-4 text-center text-xs text-gray-500">No history yet.</div>');
          return;
        }
        promptHistory.forEach(item => {
          const $row = $(`
            <div class="p-2.5 text-xs border-b">
              <div class="font-medium mb-1 select-all"></div>
              <div class="text-gray-500 text-[10px]"></div>
            </div>
          `);
          $row.find('div').first().text(item.text);
          $row.find('div').last().text(item.date);
          $list.append($row);
        });
      }

      $('#btn-history').on('click', function(){
        renderHistory();
        $('#view-history').removeClass('hidden');
        $('#view-prompt, #view-manage, #view-settings').addClass('hidden');
      });
      $('#btn-close-history, #btn-done').on('click', function(){
        $('#view-history').addClass('hidden');
        $('#view-prompt').removeClass('hidden');
      });
      $('#btn-clear-history').on('click', function(){
        promptHistory = [];
        localStorage.removeItem(STORAGE_HISTORY);
        renderHistory();
      });

      setDateBadge();
      loadPrompts();
      loadSettings();
      loadHistory();
      initDailyPrompt();
    });
  </script>
</body>
</html>
